apiVersion: apps/v1
kind: Deployment
metadata:
  name: iris-api-deployment
spec:
  replicas: 3
  selector:
    matchLabels:
      app: iris-api
  template:
    metadata:
      labels:
        app: iris-api
    spec:
      containers:
      - name: iris-api
        # just a placeholder, actual image will be set byGitHub Actions
        image: iris-api-image-placeholder 
        ports:
        - containerPort: 8000
